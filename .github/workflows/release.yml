name: Build and Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'
      draft:
        description: 'Create a draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;29.0.14206865" || sdkmanager --install "platforms;android-34" "ndk;26.1.10909125"

      - name: Build host file_to_c generator
        run: |
          g++ -O3 -std=c++17 lib/rt64/src/tools/file_to_c/file_to_c.cpp -o file_to_c
          chmod +x file_to_c

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Release Artifacts
        run: |
          mkdir -p release-output
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          
          # Find generated release/debug APK
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!" >&2
            exit 1
          fi
          
          OUTPUT_APK="release-output/BMHeroRecompiled-Android-${TAG}.apk"
          cp "$APK_FILE" "$OUTPUT_APK"
          cd release-output
          sha256sum "BMHeroRecompiled-Android-${TAG}.apk" > "BMHeroRecompiled-Android-${TAG}.apk.sha256"
          echo "Generated APK: $OUTPUT_APK"
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMHeroRecompiled-Android-APK
          path: release-output/*
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: BMHeroRecompiled Android ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: release-output/*
