name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SDL2_VERSION: "2.30.3"
  N64RECOMP_COMMIT: "98bf104b1b5ed83126af8bcab0cc964782617dbf"

jobs:
  build-linux-x64:
    name: Build Linux x64 Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang-15 \
            lld \
            llvm \
            gcc-11 \
            g++-11 \
            libgtk-3-dev \
            libfreetype6-dev \
            libfuse2 \
            pkg-config \
            wget

          echo "::group::Install SDL2 ${SDL2_VERSION}"
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar -xzf "SDL2-${SDL2_VERSION}.tar.gz"
          cd "SDL2-${SDL2_VERSION}"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          echo "::endgroup::"

      - name: Retrieve authorized game asset
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BMHERO_REPO_WITH_PAT }}
          token: ${{ secrets.BMHERO_RECOMP }}
          path: bmhero-private

      - name: Prepare local build input
        run: |
          test -f bmhero-private/bmhero.z64
          cp bmhero-private/bmhero.z64 ./bmhero.z64
          test -f BMHeroSyms/dump.toml

      - name: Build N64Recomp and RSPRecomp
        run: |
          git clone --recurse-submodules https://github.com/Mr-Wiseguy/N64Recomp.git N64RecompSource
          git -C N64RecompSource checkout "${N64RECOMP_COMMIT}"
          git -C N64RecompSource submodule update --init --recursive
          cmake -S N64RecompSource -B N64RecompSource/cmake-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-11 \
            -DCMAKE_CXX_COMPILER=g++-11
          cmake --build N64RecompSource/cmake-build --target N64RecompCLI RSPRecomp -j"$(nproc)"
          cp N64RecompSource/cmake-build/N64Recomp ./N64Recomp
          cp N64RecompSource/cmake-build/RSPRecomp ./RSPRecomp

      - name: Generate recompiled game and RSP sources
        run: |
          ./N64Recomp bmhero.toml
          ./RSPRecomp aspMain.toml

      - name: Build patch binary and generated patch sources
        run: |
          make -C patches CC=clang-15 LD=ld.lld
          ./N64Recomp patches.toml

      - name: Configure and build BMHeroRecompiled
        run: |
          cmake -S . -B build-cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_CXX_COMPILER=clang++-15
          cmake --build build-cmake --target BMHeroRecompiled -j"$(nproc)"
          test -x build-cmake/BMHeroRecompiled

      - name: Package release without ROM
        run: |
          rm -rf release-package
          mkdir -p release-package
          cp build-cmake/BMHeroRecompiled release-package/
          cp -r assets release-package/
          cp recompcontrollerdb.txt release-package/
          tar -czf "BMHeroRecompiled-Linux-x64-${GITHUB_REF_NAME}.tar.gz" -C release-package .
          if tar -tzf "BMHeroRecompiled-Linux-x64-${GITHUB_REF_NAME}.tar.gz" | grep -Eiq '\.(z64|n64|v64|nes|rom)$|(^|/)bmhero\.z64$'; then
            echo "ROM-like file detected in release archive" >&2
            exit 1
          fi
          sha256sum "BMHeroRecompiled-Linux-x64-${GITHUB_REF_NAME}.tar.gz" > "BMHeroRecompiled-Linux-x64-${GITHUB_REF_NAME}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: BMHeroRecompiled ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            BMHeroRecompiled-Linux-x64-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}.tar.gz
            BMHeroRecompiled-Linux-x64-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}.sha256
